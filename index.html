<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLOCKWORK // Tactical FPS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ LOBBY SCREEN ============ -->
  <div id="lobby" class="screen">
    <div class="lobby-bg"></div>
    <header class="lobby-header">
      <h1 class="logo">GLOCK<span>WORK</span></h1>
    </header>

    <div class="lobby-grid">

      <!-- Party panel -->
      <section class="panel party-panel">
        <h2 class="panel-title">PARTY</h2>
        <div id="playerCards" class="player-cards"></div>

        <div class="party-actions">
          <label class="field-label">YOUR NAME</label>
          <input id="nameInput" class="tactical-input" maxlength="16" placeholder="AGENT_01" />

          <div class="room-row">
            <div class="room-id-box">
              <label class="field-label">ROOM ID</label>
              <div id="roomIdDisplay" class="room-id">— — — — — —</div>
            </div>
            <button id="copyInviteBtn" class="btn btn-secondary">COPY INVITE LINK</button>
          </div>

          <div class="room-row">
            <input id="joinIdInput" class="tactical-input" placeholder="ENTER ROOM ID TO JOIN" />
            <button id="joinBtn" class="btn btn-secondary">JOIN</button>
          </div>
          <button id="hostBtn" class="btn btn-secondary">HOST NEW PARTY</button>
        </div>
      </section>

      <!-- Map selector -->
      <section class="panel map-panel">
        <h2 class="panel-title">MAP SELECT</h2>
        <div class="map-grid">
          <div class="map-card selected" data-map="shipyard">
            <div class="map-thumb shipyard-thumb"></div>
            <div class="map-name">OVERHAUL</div>
            <div class="map-desc">Industrial Shipping Yard</div>
          </div>
          <div class="map-card" data-map="courtyard">
            <div class="map-thumb courtyard-thumb"></div>
            <div class="map-name">BASTION</div>
            <div class="map-desc">Sandstone Courtyard</div>
          </div>
        </div>

        <h2 class="panel-title mode-title">MODE</h2>
        <div class="mode-row">
          <button class="mode-btn selected" data-mode="ffa">FREE FOR ALL</button>
          <button class="mode-btn" data-mode="tdm">TEAM DEATHMATCH</button>
        </div>

        <button id="startBtn" class="btn btn-primary start-btn">START MATCH</button>
        <div id="lobbyStatus" class="lobby-status">Host a party or join one with a Room ID.</div>
      </section>

    </div>
  </div>

  <!-- ============ GAME SCREEN ============ -->
  <div id="game" class="screen hidden">
    <canvas id="gameCanvas"></canvas>

    <div id="adsVignette" class="ads-vignette"></div>

    <!-- Crosshair -->
    <div id="crosshair" class="crosshair">
      <span class="ch-dot"></span>
      <span class="ch-line ch-top"></span>
      <span class="ch-line ch-bottom"></span>
      <span class="ch-line ch-left"></span>
      <span class="ch-line ch-right"></span>
    </div>

    <!-- HUD -->
    <div class="hud-bottom">
      <div class="hud-health">
        <div class="hud-label">HP</div>
        <div id="hpValue" class="hud-value">100</div>
      </div>
      <div class="hud-ammo">
        <div id="ammoValue" class="hud-value">12<span class="ammo-reserve">/36</span></div>
        <div class="hud-label">GLOCK-18</div>
      </div>
    </div>

    <div class="hud-top-left">
      <div id="fpsCounter" class="fps-counter">144 FPS</div>
    </div>

    <div id="killFeed" class="kill-feed"></div>

    <!-- Chat -->
    <div id="chatLog" class="chat-log"></div>
    <div id="chatInputWrap" class="chat-input-wrap hidden">
      <input id="chatInput" class="chat-input" maxlength="140" placeholder="Say something..." />
    </div>

    <div id="reloadPrompt" class="reload-prompt hidden">RELOADING...</div>

    <div id="pointerLockOverlay" class="pointer-lock-overlay">
      <div class="plo-box">
        <div class="plo-title">CLICK TO ENGAGE</div>
        <div class="plo-sub">WASD move · LMB fire · RMB aim · R reload · Y inspect · Scroll/Space jump · Enter chat</div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>

  <script src="js/maps.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/weapon.js"></script>
  <script src="js/movement.js"></script>
  <script src="js/network.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
