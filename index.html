<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Flashpoint — a peer-to-peer tactical bomb-defusal FPS in the browser. 100% PvP, no bots.">
  <title>Flashpoint</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230e1116'/%3E%3Cpath d='M36 6L14 36h14l-4 22 22-30H32z' fill='%23ff8a1f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>

  <div id="hud" class="hidden">
    <div id="hud-top">
      <div id="alive-ct" class="avatars ct"></div>
      <div class="score-box ct"><span id="score-ct">0</span></div>
      <div id="timer-box"><div id="round-timer">0:00</div><div id="round-label">Round 1</div></div>
      <div class="score-box t"><span id="score-t">0</span></div>
      <div id="alive-t" class="avatars t"></div>
    </div>
    <div id="radar-wrap"><canvas id="radar" width="200" height="200"></canvas><div id="callout"></div><div id="money">$800</div><div id="money-pop"></div></div>
    <div id="killfeed"></div>
    <div id="crosshair"><canvas id="xhair" width="128" height="128"></canvas></div>
    <div id="hitmarker"><i></i><i></i><i></i><i></i></div>
    <div id="dmg-indicators"></div>
    <div id="center-msg"></div>
    <div id="banner"></div>
    <div id="progress"><div id="progress-label"></div><div class="bar"><i id="progress-bar"></i></div></div>
    <div id="speedo"></div>
    <div id="hp-box"></div>
    <div id="ammo-box"></div>
    <div id="inv-list"></div>
    <div id="chat-log"></div>
    <input id="chat-input" class="hidden" maxlength="120" autocomplete="off">
    <div id="scope-overlay"><i class="h"></i><i class="v"></i></div>
    <div id="smoke-overlay"></div>
    <div id="blood-overlay"></div>
    <div id="flash-overlay"></div>
  </div>
  <div id="clickplay" class="hidden">Click to play</div>
  <div id="scoreboard" class="hidden"></div>
  <div id="buymenu" class="hidden"></div>
  <div id="touch" style="display:none"></div>
  <div id="menu" class="hidden"></div>
  <div id="found" class="hidden"></div>
  <div id="versus" class="hidden"></div>
  <div id="esc-menu" class="hidden"></div>
  <div id="loading" class="hidden"><div class="spinner"></div><div id="loading-text">Loading…</div></div>
  <div id="boot"><div class="logo">FLASH<b>POINT</b></div><div class="spinner"></div><div id="boot-msg">Loading engine…</div>
    <noscript>Flashpoint needs JavaScript and WebGL.</noscript></div>
  <div id="toast"></div>
  <div id="fps" class="hidden"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
